<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="BioStudy biology learning system">
<title>BioStudy • Sign in</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="auth-screen">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-mark">B</div>
      <div><strong>BioStudy</strong><span>Biology Learning System</span></div>
    </div>
    <p class="eyebrow">PRIVATE CLOUD LIBRARY</p>
    <h1 id="authTitle">Welcome to BioStudy</h1>
    <p class="auth-subtitle">Sign in to access your courses, notes, and study materials.</p>

    <form id="authForm">
      <label>Email
        <input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
      </label>
      <label>Password
        <input id="authPassword" type="password" minlength="6" autocomplete="current-password" placeholder="At least 6 characters" required>
      </label>
      <button class="primary-btn auth-submit" type="submit" id="authSubmit">Sign in</button>
    </form>

    <button class="link-btn" id="authToggle" type="button">Create a new account</button>
    <p class="auth-message" id="authMessage"></p>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
