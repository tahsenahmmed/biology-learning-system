<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="BioStudy biology learning system"><title>BioStudy • Sign in</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="auth-screen"><div class="auth-card"><div class="brand"><div class="brand-mark">B</div><div><strong>BioStudy</strong><span>Biology Learning System</span></div></div><p class="eyebrow">PRIVATE CLOUD LIBRARY</p><h1 id="authTitle">Sign in to BioStudy</h1><p class="auth-subtitle">Your courses, notes, and study materials sync across devices.</p><button class="google-btn" id="googleBtn" type="button"><span>G</span> Continue with Google</button><div class="auth-divider"><span>or use email</span></div><form id="authForm"><label>Email<input id="authEmail" type="email" autocomplete="email" required></label><label>Password<input id="authPassword" type="password" minlength="6" autocomplete="current-password" required></label><button class="primary-btn auth-submit" type="submit" id="authSubmit">Sign in</button></form><button class="link-btn" id="authToggle" type="button">Create a new account</button><p class="auth-message" id="authMessage"></p><p class="auth-help">Google sign-in requires the Google provider to be enabled in the Supabase project.</p></div></div><script src="app.js"></script></body></html>
